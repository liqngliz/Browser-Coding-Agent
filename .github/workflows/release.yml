name: release

# Tag v<semver> -> build.yml (test, pack, smoke) -> publish those exact artifacts.
# Trusted publishing (OIDC) on both registries; no stored API keys.
#   nuget.org policy: owner liqngliz, repo Browser-Coding-Agent, workflow release.yml, environment release
#   npm trusted publisher: same values (case-sensitive; a mismatch reports as 404)
# Partial release: "Re-run failed jobs". NuGet skips a duplicate version; npm skips only
# when the published integrity equals this run's tarball and fails otherwise.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      npm-tag: ${{ steps.parse.outputs.npm-tag }}
    steps:
      - id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "$TAG" =~ $semver ]] || { echo "::error::tag $TAG is not v<major>.<minor>.<patch>[-prerelease]"; exit 1; }
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "npm-tag=next" >> "$GITHUB_OUTPUT"; else echo "npm-tag=latest" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      retention-days: 30

  publish-nuget:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts

      - name: Verify checksums
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS

      # Temporary API key lives 1 hour: request it right before the push
      - name: NuGet login (OIDC -> temporary API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/nuget/BrowserCodingAgent.$VERSION.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --timeout 900 \
            --skip-duplicate

  publish-npm:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NPM_TAG: ${{ needs.version.outputs.npm-tag }}
      PACKAGE: '@liqngliz/browser-coding-agent'
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0
      - name: Upgrade npm
        run: npm install -g npm@11 && npm --version && node --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts

      - name: Verify checksums
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS

      - name: Publish to npm
        run: |
          tgz=$(ls artifacts/npm/*.tgz)
          integrity="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
          published=$(npm view "$PACKAGE@$VERSION" dist.integrity 2>/dev/null || true)
          if [ -n "$published" ]; then
            [ "$published" = "$integrity" ] && { echo "$PACKAGE@$VERSION already published with identical contents"; exit 0; }
            echo "::error::$PACKAGE@$VERSION already published with different contents ($published != $integrity)"
            exit 1
          fi
          npm publish "$tgz" --access public --tag "$NPM_TAG"
