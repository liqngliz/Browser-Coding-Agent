name: post-release-smoke

# After a release: wait until nuget.org serves the version, install the .NET tool from nuget.org
# (not from build artifacts), and run scripts/smoke.mjs against installed Microsoft Edge.
# Runs even when the release run failed overall: publish-nuget can succeed while publish-npm fails.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Published BrowserCodingAgent version, e.g. 0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  PACKAGE_ID: BrowserCodingAgent
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        env:
          INPUT: ${{ inputs.version }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          version="${INPUT:-${TAG#v}}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "$version" =~ $semver ]] || { echo "::error::'$version' is not a semver version (input '$INPUT', tag '$TAG')"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # nuget.org validates, then indexes: the gallery page appears before installs resolve
  wait-for-nuget:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Wait for nuget.org to serve the version
        run: |
          index="https://api.nuget.org/v3-flatcontainer/$(echo "$PACKAGE_ID" | tr '[:upper:]' '[:lower:]')/index.json"
          want=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')
          for attempt in $(seq 1 180); do
            if curl -fsS "$index" 2>/dev/null | jq -e --arg v "$want" '.versions | index($v) != null' >/dev/null; then
              echo "$PACKAGE_ID $VERSION available after attempt $attempt"
              exit 0
            fi
            sleep 30
          done
          echo "::error::$PACKAGE_ID $VERSION not served by nuget.org after 90 minutes"
          exit 1

  smoke:
    needs: [version, wait-for-nuget]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Log directory
        run: echo "SMOKE_LOG_DIR=$RUNNER_TEMP/smoke-logs" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # The CDN behind the flat container can lag the index by a few minutes
      - name: Install from nuget.org
        run: |
          for attempt in 1 2 3 4 5; do
            dotnet tool install "$PACKAGE_ID" --version "$VERSION" --tool-path "$RUNNER_TEMP/tool" && break
            [ "$attempt" = 5 ] && exit 1
            sleep 60
          done

      - name: Installed version matches
        run: |
          dotnet tool list --tool-path "$RUNNER_TEMP/tool" | tee "$RUNNER_TEMP/tools.txt"
          grep -iE "^browsercodingagent[[:space:]]+$VERSION[[:space:]]" "$RUNNER_TEMP/tools.txt" \
            || { echo "::error::installed version is not $VERSION"; exit 1; }

      - name: Smoke with Microsoft Edge
        run: node scripts/smoke.mjs --tool "$RUNNER_TEMP/tool/browser-coding-agent" --channel msedge

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: post-release-smoke-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke-logs
          retention-days: 14
